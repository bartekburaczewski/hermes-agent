#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Fork note (bartekburaczewski/hermes-agent, `deploy` branch): the volume
# path was changed from ~/.hermes to ${HERMES_DATA_DIR:-/data/hermes-agent}
# because Coolify runs `docker compose` in a context where `~` does not
# resolve to a real user's home directory. See DEPLOY.md.
#
# Also mounts the user's `second-brain` Obsidian vault (a separate git repo,
# github.com/bartekburaczewski/second-brain) read-write at /opt/data/second-brain,
# so the bundled `obsidian` skill can use it directly. OBSIDIAN_VAULT_PATH is
# set in the container's .env to point at that in-container path.
#
# Set HERMES_UID / HERMES_GID to the host user that owns HERMES_DATA_DIR so
# files created inside the container stay readable/writable on the host.
# The s6-overlay stage2 hook remaps the internal `hermes` user to these
# values via usermod/groupmod; each supervised service then drops to that
# user via `s6-setuidgid`.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep `/init` as the first command in
#     the chain (or let docker use the image's default ENTRYPOINT,
#     which is `["/init", "/opt/hermes/docker/main-wrapper.sh"]`).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${HERMES_DATA_DIR:-/data/hermes-agent}:/opt/data
      - ${SECOND_BRAIN_DIR:-/home/bartoszburaczewski/second-brain}:/opt/data/second-brain
      # Dedicated deploy key (read-write, second-brain repo only - NOT the
      # user's personal key) so the auto-sync cron job (see DEPLOY.md) can
      # git pull/push from inside the container. Read-only mount.
      - ${SECOND_BRAIN_DEPLOY_KEY:-/home/bartoszburaczewski/.ssh/second_brain_deploy_key}:/opt/data/second-brain-deploy-key:ro
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ${HERMES_DATA_DIR:-/data/hermes-agent}:/opt/data
      - ${SECOND_BRAIN_DIR:-/home/bartoszburaczewski/second-brain}:/opt/data/second-brain
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    # Localhost-only. For remote access, tunnel via `ssh -L 9119:localhost:9119`.
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]

  # Multica (github.com/multica-ai/multica) runtime daemon — drives this same
  # Hermes install as a "teammate" agent on a Multica board via ACP (`hermes
  # acp`). Shares the gateway's volume/HERMES_HOME on purpose: same
  # ANTHROPIC_TOKEN, same memory/session_search tool-disable already applied
  # (see DEPLOY.md), no separate auth step needed. See project_multica_integration
  # memory for the full rationale/tradeoffs (chose shared-volume over an
  # isolated second container for lower resource usage).
  multica-daemon:
    image: hermes-agent
    container_name: hermes-multica-daemon
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ${HERMES_DATA_DIR:-/data/hermes-agent}:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    # Self-installs the multica CLI into the persistent volume on first boot
    # (idempotent — skips the download once /opt/data/bin/multica exists),
    # then runs the daemon in the foreground so Docker/s6 can supervise it.
    command:
      - sh
      - -c
      - |
        test -x /opt/data/bin/multica || {
          mkdir -p /opt/data/bin
          latest=$$(curl -sI https://github.com/multica-ai/multica/releases/latest | grep -i '^location:' | sed 's#.*tag/##' | tr -d '\r\n')
          version="$${latest#v}"
          curl -fsSL "https://github.com/multica-ai/multica/releases/download/$${latest}/multica-cli-$${version}-linux-amd64.tar.gz" | tar xz -C /opt/data/bin multica
        }
        exec /opt/data/bin/multica daemon start --foreground
